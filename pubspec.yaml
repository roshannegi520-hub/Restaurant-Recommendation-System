name: flutter_application_1
description: "Smart Recommender Capstone Project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: any
  firebase_auth: ^6.4.0
  cloud_firestore: any
  flutter_dotenv: any
  url_launcher: any
  geolocator: any
  geocoding: any
  http: any
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: any
  flutter_native_splash: any

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png

# --- THE LOGO GENERATOR ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

# --- THE SPLASH SCREEN GENERATOR ---
flutter_native_splash:
  color: "#F5F7FA"
  image: "assets/logo.png"
  android: true
  ios: true